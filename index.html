<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Pro Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .overall-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .overall-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: var(--text-muted);
    }

    .overall-percentage {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1;
    }

    .overall-stats {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .threshold-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .threshold-control input {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
    }

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .subject-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .subject-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subject-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.25rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      background: var(--bg);
    }

    .input-group input:focus {
      border-color: var(--primary);
    }

    .progress-bar-container {
      height: 8px;
      width: 100%;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      background: #ffffff;
      transition: background 0.15s;
    }

    .btn-action.present:hover {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .btn-action.absent:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .status-badge {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .status-safe {
      background-color: var(--success-bg);
      color: var(--success);
    }

    .status-danger {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .add-form input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Attendance Dashboard</h1>
      <p>Track, manage, and optimize your attendance status</p>
    </header>

    <div class="card overall-card">
      <div class="overall-title">Overall Attendance</div>
      <div class="overall-percentage" id="overall-percentage">0.00%</div>
      <div class="overall-stats" id="overall-stats">0 of 0 Classes Attended</div>
      <div class="threshold-control">
        <label for="threshold-input">Target Criteria:</label>
        <input type="number" id="threshold-input" value="75" min="1" max="100" />%
      </div>
    </div>

    <div class="subject-list" id="subject-list"></div>

    <div class="card">
      <form class="add-form" id="add-subject-form">
        <label style="font-weight: 700; font-size: 0.9rem;">+ Add New Subject</label>
        <input type="text" id="subject-name" placeholder="e.g., Data Structures, Physics" required />
        <button type="submit" class="btn-primary">Add Subject</button>
      </form>
    </div>
  </div>

  <script>
    let targetThreshold = 75;
    let subjects = JSON.parse(localStorage.getItem('attendance_subjects')) || [
      { id: '1', name: 'Mathematics', total: 25, attended: 20 }
    ];

    const subjectListEl = document.getElementById('subject-list');
    const overallPercentageEl = document.getElementById('overall-percentage');
    const overallStatsEl = document.getElementById('overall-stats');
    const thresholdInput = document.getElementById('threshold-input');
    const addForm = document.getElementById('add-subject-form');

    function saveState() {
      localStorage.setItem('attendance_subjects', JSON.stringify(subjects));
      localStorage.setItem('attendance_threshold', targetThreshold);
    }

    function calculateStatus(attended, total, target) {
      if (total === 0) return { pct: 0, text: 'No classes recorded yet.', isSafe: true };
      const pct = (attended / total) * 100;
      const tFrac = target / 100;

      if (pct >= target) {
        const canBunk = Math.floor((attended - (tFrac * total)) / tFrac);
        const text = canBunk === 0 
          ? `On track (${pct.toFixed(1)}%). You cannot miss the next class.`
          : `Safe (${pct.toFixed(1)}%). You can miss approximately ${canBunk} class(es).`;
        return { pct, text, isSafe: true };
      } else {
        const needToAttend = Math.ceil(((tFrac * total) - attended) / (1 - tFrac));
        return { 
          pct, 
          text: `Shortage (${pct.toFixed(1)}%). Attend next ${needToAttend} class(es) consecutively to hit ${target}%.`, 
          isSafe: false 
        };
      }
    }

    function render() {
      subjectListEl.innerHTML = '';
      let totalAll = 0;
      let attendedAll = 0;

      subjects.forEach((subject) => {
        totalAll += subject.total;
        attendedAll += subject.attended;

        const { pct, text, isSafe } = calculateStatus(subject.attended, subject.total, targetThreshold);

        const card = document.createElement('div');
        card.className = 'card subject-card';
        card.innerHTML = `
          <div class="subject-header">
            <span class="subject-title">${subject.name}</span>
            <button class="delete-btn" onclick="deleteSubject('${subject.id}')">&times;</button>
          </div>

          <div class="input-grid">
            <div class="input-group">
              <label>Total Classes</label>
              <input type="number" min="0" value="${subject.total}" onchange="updateValues('${subject.id}', 'total', this.value)" />
            </div>
            <div class="input-group">
              <label>Attended</label>
              <input type="number" min="0" value="${subject.attended}" onchange="updateValues('${subject.id}', 'attended', this.value)" />
            </div>
          </div>

          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${Math.min(pct, 100)}%; background: ${isSafe ? 'var(--success)' : 'var(--danger)'}"></div>
          </div>

          <div class="action-buttons">
            <button class="btn-action present" onclick="quickLog('${subject.id}', true)">+ Present</button>
            <button class="btn-action absent" onclick="quickLog('${subject.id}', false)">+ Absent</button>
          </div>

          <div class="status-badge ${isSafe ? 'status-safe' : 'status-danger'}">
            ${text}
          </div>
        `;
        subjectListEl.appendChild(card);
      });

      const overallPct = totalAll > 0 ? (attendedAll / totalAll) * 100 : 0;
      overallPercentageEl.textContent = `${overallPct.toFixed(2)}%`;
      overallPercentageEl.style.color = overallPct >= targetThreshold ? 'var(--success)' : 'var(--danger)';
      overallStatsEl.textContent = `${attendedAll} of ${totalAll} Classes Attended`;

      saveState();
    }

    function quickLog(id, wasPresent) {
      subjects = subjects.map(s => {
        if (s.id === id) {
          return {
            ...s,
            total: s.total + 1,
            attended: wasPresent ? s.attended + 1 : s.attended
          };
        }
        return s;
      });
      render();
    }

    function updateValues(id, field, value) {
      const numVal = Math.max(0, parseInt(value) || 0);
      subjects = subjects.map(s => {
        if (s.id === id) {
          const updated = { ...s, [field]: numVal };
          if (updated.attended > updated.total) {
            updated.total = updated.attended;
          }
          return updated;
        }
        return s;
      });
      render();
    }

    function deleteSubject(id) {
      subjects = subjects.filter(s => s.id !== id);
      render();
    }

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('subject-name');
      const name = input.value.trim();
      if (!name) return;

      subjects.push({
        id: Date.now().toString(),
        name,
        total: 0,
        attended: 0
      });

      input.value = '';
      render();
    });

    thresholdInput.addEventListener('change', (e) => {
      targetThreshold = Math.min(100, Math.max(1, parseInt(e.target.value) || 75));
      render();
    });

    const savedThreshold = localStorage.getItem('attendance_threshold');
    if (savedThreshold) {
      targetThreshold = parseInt(savedThreshold);
      thresholdInput.value = targetThreshold;
    }

    render();
  </script>
</body>
</html>
