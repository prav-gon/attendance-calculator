<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Attendance Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    padding: 18px;
    color: #1e293b;
}

.container {
    max-width: 600px;
    margin: auto;
}

.header {
    text-align: center;
    padding: 25px 10px;
}

.logo {
    font-size: 55px;
}

h1 {
    margin: 8px 0;
    font-size: 30px;
}

.subtitle {
    color: #64748b;
    margin: 0;
}

.overall {
    background: white;
    padding: 22px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
}

.overall-title {
    color: #64748b;
    font-weight: bold;
}

.overall-number {
    font-size: 42px;
    font-weight: bold;
    margin: 8px;
}

.subject {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

.subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.subject-name {
    font-size: 19px;
    font-weight: bold;
}

.delete {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    padding: 7px 10px;
    border-radius: 8px;
}

.inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

label {
    font-size: 13px;
    font-weight: bold;
    color: #64748b;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 16px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

.attendance {
    margin-top: 16px;
    font-size: 25px;
    font-weight: bold;
}

.progress {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 10px;
}

.safe {
    color: #16a34a;
}

.danger {
    color: #dc2626;
}

.warning {
    color: #d97706;
}

.message {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
}

.safe-box {
    background: #dcfce7;
    color: #166534;
}

.danger-box {
    background: #fee2e2;
    color: #991b1b;
}

.info-box {
    background: #dbeafe;
    color: #1e40af;
}

.add-box {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-top: 18px;
}

.add-box input {
    margin-top: 10px;
}

button.add {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.reset {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #e2e8f0;
    color: #334155;
    font-weight: bold;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #94a3b8;
    font-size: 13px;
}

</style>
</head>


<body>

<div class="container">

<div class="header">

<div class="logo">📚</div>

<h1>Attendance Dashboard</h1>

<p class="subtitle">
Track all your subjects in one place
</p>

</div>


<div class="overall">

<div class="overall-title">
OVERALL ATTENDANCE
</div>

<div class="overall-number" id="overall">
0%
</div>

<div id="overallMessage">
Add your class details below.
</div>

</div>


<div id="subjects"></div>


<div class="add-box">

<h3>➕ Add Subject</h3>

<input
type="text"
id="newSubject"
placeholder="Example: Engineering Drawing"
>

<button class="add" onclick="addSubject()">
Add Subject
</button>

</div>


<button class="reset" onclick="resetAll()">
🔄 Reset All Data
</button>


<div class="footer">
Student Attendance Dashboard
</div>

</div>


<script>

let defaultSubjects = [

{
name: "Mathematics",
total: 0,
attended: 0
},

{
name: "Basic Electrical Engineering",
total: 0,
attended: 0
},

{
name: "Mechanical Engineering",
total: 0,
attended: 0
},

{
name: "Civil Engineering",
total: 0,
attended: 0
},

{
name: "Leadership",
total: 0,
attended: 0
},

{
name: "Physics",
total: 0,
attended: 0
}

];


let subjects =
JSON.parse(localStorage.getItem("attendanceSubjects"))
|| defaultSubjects;


function saveData() {

localStorage.setItem(
"attendanceSubjects",
JSON.stringify(subjects)
);

}


function calculateAttendance(total, attended) {

if (total <= 0) {
return 0;
}

return (attended / total) * 100;

}


function classesNeeded(total, attended) {

let required = 75;

if (total <= 0) {
return 0;
}

if ((attended / total) * 100 >= required) {
return 0;
}

return Math.ceil(
(required * total - 100 * attended)
/
(100 - required)
);

}


function classesCanMiss(total, attended) {

let required = 75;

if (total <= 0) {
return 0;
}

if ((attended / total) * 100 < required) {
return 0;
}

return Math.floor(
(attended / (required / 100)) - total
);

}


function renderSubjects() {

let container =
document.getElementById("subjects");

container.innerHTML = "";


subjects.forEach((subject, index) => {

let percentage =
calculateAttendance(
subject.total,
subject.attended
);


let needed =
classesNeeded(
subject.total,
subject.attended
);


let canMiss =
classesCanMiss(
subject.total,
subject.attended
);


let statusClass =
percentage >= 75
? "safe"
: "danger";


let message = "";


if (subject.total === 0) {

message = `
<div class="message info-box">
Enter your classes to calculate attendance.
</div>
`;

}
else if (percentage >= 75) {

message = `
<div class="message safe-box">
🟢 You are above 75%.
You can miss approximately
<strong>${canMiss}</strong> more class(es).
</div>
`;

}
else {

message = `
<div class="message danger-box">
🔴 Below 75%.
You need to attend
<strong>${needed}</strong>
consecutive class(es) to reach 75%.
</div>
`;

}


container.innerHTML += `

<div class="subject">

<div class="subject-header">

<div class="subject-name">
${subject.name}
</div>

<button
class="delete"
onclick="deleteSubject(${index})">
✕
</button>

</div>


<div class="inputs">

<div>

<label>Total Classes</label>

<input
type="number"
min="0"
value="${subject.total}"
oninput="updateSubject(${index}, 'total', this.value)"
>

</div>


<div>

<label>Classes Attended</label>

<input
type="number"
min="0"
value="${subject.attended}"
oninput="updateSubject(${index}, 'attended', this.value)"
>

</div>

</div>


<div class="attendance ${statusClass}">
${percentage.toFixed(2)}%
</div>


<div class="progress">

<div
class="progress-bar"
style="
width:${Math.min(percentage,100)}%;
background:${percentage >= 75 ? '#22c55e' : '#ef4444'};
">
</div>

</div>


${message}

</div>

`;

});


updateOverall();

}


function updateSubject(index, type, value) {

    value = Number(value);

    if (value < 0) {
        value = 0;
    }

    if (type === "total") {

        subjects[index].total = value;

        if (subjects[index].attended > value) {
            subjects[index].attended = value;
        }

    } else {

        if (value > subjects[index].total) {
            value = subjects[index].total;
        }

        subjects[index].attended = value;
    }

    saveData();

    updateOverall();

    // Update only this subject card
    let cards = document.querySelectorAll(".subject");
    let card = cards[index];

    if (!card) return;

    let percentage = calculateAttendance(
        subjects[index].total,
        subjects[index].attended
    );

    let attendance = card.querySelector(".attendance");
    let progress = card.querySelector(".progress-bar");
    let message = card.querySelector(".message");

    attendance.innerText = percentage.toFixed(2) + "%";

    attendance.className =
        "attendance " +
        (percentage >= 75 ? "safe" : "danger");

    progress.style.width =
        Math.min(percentage, 100) + "%";

    progress.style.background =
        percentage >= 75 ? "#22c55e" : "#ef4444";

    let needed = classesNeeded(
        subjects[index].total,
        subjects[index].attended
    );

    let canMiss = classesCanMiss(
        subjects[index].total,
        subjects[index].attended
    );

    if (subjects[index].total === 0) {

        message.className = "message info-box";

        message.innerHTML =
            "Enter your classes to calculate attendance.";

    } else if (percentage >= 75) {

        message.className = "message safe-box";

        message.innerHTML =
            "🟢 You are above 75%. You can miss approximately " +
            "<strong>" + canMiss + "</strong>" +
            " more class(es).";

    } else {

        message.className = "message danger-box";

        message.innerHTML =
            "🔴 Below 75%. You need to attend " +
            "<strong>" + needed + "</strong>" +
            " consecutive class(es) to reach 75%.";

    }
}


function updateOverall() {

let totalClasses = 0;

let totalAttended = 0;


subjects.forEach(subject => {

totalClasses += Number(subject.total);

totalAttended += Number(subject.attended);

});


let overall =
totalClasses > 0
? (totalAttended / totalClasses) * 100
: 0;


let element =
document.getElementById("overall");


element.innerText =
overall.toFixed(2) + "%";


element.className =
"overall-number " +
(overall >= 75 ? "safe" : "danger");


let message =
document.getElementById("overallMessage");


if (totalClasses === 0) {

message.innerText =
"Add your class details below.";

}
else if (overall >= 75) {

message.innerHTML =
"🟢 Your overall attendance is above 75%.";

}
else {

message.innerHTML =
"🔴 Your overall attendance is below 75%.";

}

}


function addSubject() {

let input =
document.getElementById("newSubject");

let name =
input.value.trim();


if (name === "") {

alert("Please enter a subject name.");

return;

}


subjects.push({

name: name,

total: 0,

attended: 0

});


input.value = "";

saveData();

renderSubjects();

}


function deleteSubject(index) {

if (
confirm(
"Are you sure you want to delete this subject?"
)
) {

subjects.splice(index, 1);

saveData();

renderSubjects();

}

}


function resetAll() {

if (
confirm(
"This will delete all your attendance data. Continue?"
)
) {

localStorage.removeItem(
"attendanceSubjects"
);

subjects =
JSON.parse(
JSON.stringify(defaultSubjects)
);

saveData();

renderSubjects();

}

}


renderSubjects();

</script>

</body>

</html>
