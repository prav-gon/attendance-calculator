<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="app-container">
    <!-- Header with Animated Mascot -->
    <header class="header">
      <div class="mascot-wrapper" id="mascot-container">
        <!-- Animated Cartoon SVG -->
        <svg class="mascot-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="65" rx="46" ry="42" class="mascot-body" />
          <!-- Eyes -->
          <circle cx="44" cy="58" r="6" class="mascot-eye eye-left" />
          <circle cx="76" cy="58" r="6" class="mascot-eye eye-right" />
          <!-- Happy / Normal Mouth -->
          <path d="M 48 74 Q 60 84 72 74" class="mascot-mouth mouth-happy" />
          <!-- Sad Mouth -->
          <path d="M 48 80 Q 60 70 72 80" class="mascot-mouth mouth-sad" />
          <!-- Sweat Drop for Danger Zone -->
          <path d="M 88 40 Q 94 48 88 54 Q 82 48 88 40 Z" class="mascot-sweat" />
        </svg>
      </div>
      <h1>Attendance Tracker</h1>
      <p id="overall-status" class="subtitle">Add a subject to get started</p>
    </header>

    <!-- Subject Cards List -->
    <section id="subjects-container" class="cards-list"></section>

    <!-- Add Subject Form -->
    <section class="add-card">
      <h3>+ Add New Subject</h3>
      <form id="add-subject-form" class="add-form">
        <input 
          type="text" 
          id="subject-name-input" 
          placeholder="e.g. Physics, Data Structures" 
          required 
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary btn-animated">Add Subject</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
