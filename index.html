<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f1f5f9;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Attendance Calculator</h1>

    <label>Total Classes</label>
    <input type="number" id="total">

    <label>Classes Attended</label>
    <input type="number" id="attended">

    <label>Required Attendance (%)</label>
    <input type="number" id="required" value="75">

    <button onclick="calculate()">Calculate Attendance</button>

    <div id="result">
        Enter your details and press Calculate.
    </div>

</div>

<script>

function calculate() {

    let total = Number(document.getElementById("total").value);
    let attended = Number(document.getElementById("attended").value);
    let required = Number(document.getElementById("required").value);

    if (total <= 0 || attended < 0 || attended > total) {
        document.getElementById("result").innerHTML =
            "❌ Please enter valid numbers.";
        return;
    }

    let percentage = (attended / total) * 100;

    let result = "";

    result += "<h2>Attendance: " + percentage.toFixed(2) + "%</h2>";

    if (percentage >= required) {

        result += "✅ You are above the required attendance.";

        let canMiss = Math.floor(
            (attended / (required / 100)) - total
        );

        if (canMiss > 0) {
            result += "<br><br>📌 You can miss approximately " +
                canMiss + " more class(es).";
        }

    } else {

        result += "🔴 Your attendance is below the required percentage.";

        let needed = Math.ceil(
            (required * total - 100 * attended) /
            (100 - required)
        );

        result += "<br><br>📚 You need to attend approximately " +
            needed + " consecutive class(es) to reach " +
            required + "%.";
    }

    document.getElementById("result").innerHTML = result;
}

</script>

</body>
</html>
