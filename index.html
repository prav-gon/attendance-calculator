<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Pro Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Attendance Dashboard</h1>
      <p>Track, manage, and optimize your attendance status</p>
    </header>

    <div class="card overall-card">
      <div class="overall-title">Overall Attendance</div>
      <div class="overall-percentage" id="overall-percentage">0.00%</div>
      <div class="overall-stats" id="overall-stats">0 of 0 Classes Attended</div>
      <div class="threshold-control">
        <label for="threshold-input">Target Criteria:</label>
        <input type="number" id="threshold-input" value="75" min="1" max="100" />%
      </div>
    </div>

    <div class="subject-list" id="subject-list"></div>

    <!-- NEW: Trend chart card -->
    <div class="card">
      <div class="section-header">
        <span class="section-title">Attendance Trend</span>
      </div>
      <canvas id="trend-chart" height="180"></canvas>
    </div>

    <!-- NEW: History log card -->
    <div class="card">
      <div class="section-header">
        <span class="section-title">History Log</span>
        <button class="link-btn" id="clear-history-btn">Clear</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>

    <div class="card">
      <form class="add-form" id="add-subject-form">
        <label style="font-weight: 700; font-size: 0.9rem;">+ Add New Subject</label>
        <input type="text" id="subject-name" placeholder="e.g., Data Structures, Physics" required />
        <button type="submit" class="btn-primary">Add Subject</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
